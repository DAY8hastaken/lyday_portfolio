<style>
/* MODERN NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 80px;
  background: linear-gradient(135deg, rgba(20, 20, 20, 0.98) 0%, rgba(35, 35, 35, 0.98) 100%);
  backdrop-filter: blur(15px);
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  animation: slideDown 0.8s ease;
}

/* Logo styling with gradient text */
.logo {
  background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
  position: relative;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
}

.logo::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, #ffffff, #808080);
  bottom: -8px;
  left: 0;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.logo:hover::before {
  transform: scaleX(1);
}

.logo:hover {
  letter-spacing: 3px;
}

/* Navigation links */
.nav-links {
  display: flex;
  gap: 15px;
}

.nav-links a {
  color: #e0e0e0;
  text-decoration: none;
  padding: 10px 20px;
  font-size: 16px;
  font-weight: 500;
  position: relative;
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
  overflow: hidden;
}

/* Gradient underline effect */
.nav-links a::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, #ffffff 0%, #808080 100%);
  left: 0;
  bottom: 5px;
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.nav-links a:hover::before {
  transform: scaleX(1);
  transform-origin: left;
}

/* Glowing background effect on hover */
.nav-links a::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(128, 128, 128, 0.1) 100%);
  z-index: -1;
  border-radius: 8px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.nav-links a:hover::after {
  opacity: 1;
}

.nav-links a:hover {
  color: #ffffff;
  transform: translateY(-2px);
}

/* Active link styling */
.nav-links a.active {
  color: #ffffff;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(128, 128, 128, 0.1) 100%);
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
}

/* Slide down animation */
@keyframes slideDown {
  from {
    transform: translateY(-100%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* Hamburger menu (hidden by default) */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 10px;
}

.hamburger span {
  width: 28px;
  height: 3px;
  background: linear-gradient(90deg, #ffffff, #a0a0a0);
  border-radius: 2px;
  transition: all 0.3s ease;
}

.hamburger:hover span {
  background: #ffffff;
}

/* Mobile responsive */
@media (max-width: 768px) {
  .navbar {
    padding: 20px 30px;
  }

  .hamburger {
    display: flex;
  }

  .nav-links {
    position: fixed;
    left: -100%;
    top: 77px;
    flex-direction: column;
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.98) 0%, rgba(35, 35, 35, 0.98) 100%);
    backdrop-filter: blur(15px);
    width: 100%;
    text-align: center;
    transition: left 0.4s ease;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    padding: 30px 0;
    gap: 0;
  }

  .nav-links.active {
    left: 0;
  }

  .nav-links a {
    padding: 20px;
    width: 100%;
    font-size: 18px;
  }

  .nav-links a::before {
    bottom: 8px;
  }
}
</style>

<div class="navbar">
  <div class="logo">Lyday</div>

  <div class="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="nav-links" id="navLinks">
    <a href="home.html" class="active">Home</a>
    <a href="resume.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<script>
function toggleMenu() {
  const navLinks = document.getElementById('navLinks');
  navLinks.classList.toggle('active');
}

// Close menu when clicking outside
document.addEventListener('click', function(event) {
  const navbar = document.querySelector('.navbar');
  const navLinks = document.getElementById('navLinks');
  
  if (!navbar.contains(event.target)) {
    navLinks.classList.remove('active');
  }
});

// Close menu when clicking a link (mobile)
document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', function() {
    if (window.innerWidth <= 768) {
      document.getElementById('navLinks').classList.remove('active');
    }
  });
});
</script>
